# Build and test every pull request, and main after each merge.
#
# The build is --no-incremental on purpose: Avalonia's XAML compiler reports its
# warnings only when it recompiles the .axaml, and an incremental build can show
# none while a clean one shows several. That is how #159 merged with six. Warnings
# are errors through Directory.Build.props, so a clean build is the warning gate.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build ESA.NET.slnx -c Release --no-incremental

      - name: Test
        run: dotnet test ESA.NET.slnx -c Release --no-build
